<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ocean Control Center</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1729;color:#eaf4ff;font:15px system-ui}main{max-width:1100px;margin:auto;padding:24px}header,section{background:#14263d;border:1px solid #29415b;border-radius:18px;padding:20px;margin:0 0 16px}h1,h2,p{margin:0 0 12px}h1{font-size:29px}h2{font-size:18px}small{color:#a9c1d8}button,input,select,textarea{font:inherit;border:1px solid #48617c;border-radius:9px;padding:10px;color:inherit;background:#203852}button{cursor:pointer}button:hover{background:#315777}button.primary{background:#087e91}button.danger{background:#922e46}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:12px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:16px 0}.metric{background:#0e1e31;padding:14px;border-radius:12px}.metric b{display:block;font-size:25px}.actions{display:flex;gap:8px;flex-wrap:wrap}label{display:block;margin:8px 0}input,textarea,select{max-width:100%}textarea{width:100%}table{border-collapse:collapse;width:100%;min-width:530px}td,th{text-align:left;padding:10px;border-bottom:1px solid #38506a}.scroll{overflow:auto}.notice{background:#473923;padding:12px;border-radius:10px;color:#ffe2a5}a{color:#7be4f3}#log{max-height:180px;overflow:auto;white-space:pre-wrap}button:disabled{opacity:.45;cursor:default}</style><style>[hidden]{display:none!important}</style><main><header><small>ENGLISH FISHER QUEST • TEACHER V2</small><h1>⚓ Ocean Control Center</h1><p id="notice" class="notice" role="status">Connecting to Firebase…</p><form id="login"><label>Email <input id="email" type="email" required autocomplete="username"></label><label>Password <input id="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form><button id="logout" hidden>Sign out</button></header><div id="dashboard" hidden><section><h2>Live classroom monitoring</h2><form id="watch"><input id="room" value="TEST01" required pattern="[A-Za-z0-9_-]{1,32}"><button>Connect room</button></form><div class="metrics"><div class="metric"><small>Registered captains (not online count)</small><b id="count">0</b></div><div class="metric"><small>Coins in room</small><b id="total">0</b></div></div><button id="export">Export CSV</button> <button class="danger" id="deleteRoom">Delete Classroom</button><div class="scroll"><table><thead><tr><th>Captain</th><th>Coins</th><th>Energy</th><th>Ship</th><th>Rod</th><th>Correct</th><th>Wrong</th><th>Answered</th><th>Academic score</th><th>Biography C/T</th><th>Figurative C/T</th><th>Narrative C/T</th><th>Mission</th></tr></thead><tbody id="players"></tbody></table></div></section><section><h2>Game controls</h2><div class="actions"><select id="disasterKind"><option value="0">Thunderstorm</option><option value="1">Whirlpool</option><option value="2">Heavy fog</option><option value="3">Extreme waves</option></select><button id="disaster">Trigger sea disaster</button><label for="duration">Session duration</label><select id="duration"><option value="15">15 minutes</option><option value="30" selected>30 minutes</option><option value="45">45 minutes</option><option value="60">60 minutes</option><option value="90">90 minutes</option><option value="120">120 minutes</option><option value="custom">Custom duration</option></select><input id="customDuration" type="number" min="1" max="480" step="1" value="30" aria-label="Custom duration in minutes" hidden><button id="start">Start session</button><button id="pause">Pause / Resume</button><button id="end">End game</button><button id="forceClose" style="background:#b91c1c;color:white">Force close all players</button></div><p id="session">READY</p><textarea id="announcement" placeholder="Announcement"></textarea><button id="send">Send announcement</button></section></div></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
import {getDatabase,ref,onValue,update,remove} from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js';
const app=initializeApp({"databaseURL":"https://english-fisher-quest-default-rtdb.asia-southeast1.firebasedatabase.app","apiKey":"AIzaSyAX16yMLLbjakjN-16S6O0jLbSbigPfWZE","authDomain":"english-fisher-quest.firebaseapp.com","projectId":"english-fisher-quest","appId":"1:799273316891:web:f43bd650bca759dd227ebe"}),auth=getAuth(app),db=getDatabase(app),teacher='6XgVmi5eMzLZ9W6JasGYYeffcnw2',$=id=>document.getElementById(id);let stop=null,controlStop=null,players=[],room='',session={};
const doc=(db,...p)=>ref(db,p.join('/')),collection=(db,...p)=>ref(db,'players/'+p[4]),onSnapshot=(r,fn,err)=>onValue(r,s=>fn({data:()=>s.val(),docs:Object.values(s.val()||{}).map(v=>({data:()=>v}))}),err),setDoc=(r,v)=>update(r,v);
function message(m){$('notice').textContent=m}
function academic(p){const c=p.correct||0,w=p.wrong||0,n=c+w;const topics=['biography','figurative','narrative'].map(k=>{const t=p.academicTopics?.[k]||{correct:0,wrong:0};return t.correct+'/'+(t.correct+t.wrong)});return [n,n?Math.round(c/n*10000)/100:'',...topics,n>=40?'Completed':'Incomplete']}
function render(){ $('players').replaceChildren();$('count').textContent=players.length;$('total').textContent=players.reduce((n,p)=>n+(Number(p.coins)||0),0);for(const p of [...players].sort((a,b)=>(b.coins||0)-(a.coins||0))){const tr=document.createElement('tr');for(const v of [p.name,p.coins,p.energy,p.boatLevel,p.rodLevel,p.correct??0,p.wrong??0,...academic(p)]){const td=document.createElement('td');td.textContent=v??'—';tr.append(td)}$('players').append(tr)}}
$('login').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value)}catch(e){message('Login failed: '+e.code)}finally{$('password').value=''}};
$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,user=>{if(stop){stop();stop=null}if(controlStop){controlStop();controlStop=null}room='';players=[];render();const ok=user?.uid===teacher;$('dashboard').hidden=!ok;$('login').hidden=!!ok;$('logout').hidden=!ok;message(ok?'Teacher authenticated. Enter room code.':user?'Access denied: teacher account required.':'Sign in with your teacher account.');if(user&&!ok)signOut(auth)});
$('watch').onsubmit=e=>{e.preventDefault();if(auth.currentUser?.uid!==teacher)return;room=$('room').value.trim().toUpperCase();if(!/^[A-Z0-9_-]{1,32}$/.test(room))return;if(stop)stop();if(controlStop)controlStop();session={};controlStop=onSnapshot(doc(db,'rooms',room),snap=>{session=snap.data()||{}},e=>message(e.code));players=[];render();message('Connecting room '+room);stop=onSnapshot(collection(db,'artifacts','english-fisher-quest','public','data','room_'+room),snap=>{players=snap.docs.map(d=>d.data());render();message('Live monitoring: '+room)},e=>message('Room error: '+e.code))};
async function control(data){if(!room||auth.currentUser?.uid!==teacher)return message('Connect a room first');try{await setDoc(doc(db,'rooms',room),data,{merge:true})}catch(e){message(e.code)}}
$('duration').onchange=()=>{$('customDuration').hidden=$('duration').value!=='custom'};
$('start').onclick=()=>{const minutes=Number($('duration').value==='custom' ? $('customDuration').value : $('duration').value);if(!Number.isInteger(minutes)||minutes<1||minutes>480)return message('Choose a duration from 1 to 480 minutes.');const ms=minutes*60000;if(confirm('Start a new '+minutes+'-minute timer?'))control({status:'LIVE',deleted:false,deadline:Date.now()+ms,remaining:ms})};
$('disaster').onclick=()=>{if(session.status!=='LIVE'||Date.now()>=session.deadline)return message('Start an active session first');control({disasterKind:Number($('disasterKind').value),disasterAt:Date.now()})};
$('pause').onclick=()=>{if(session.status==='LIVE')control({status:'PAUSED',remaining:Math.max(0,session.deadline-Date.now())});else if(session.status==='PAUSED')control({status:'LIVE',deadline:Date.now()+session.remaining})};
$('end').onclick=()=>control({status:'ENDED',remaining:0});$('forceClose').onclick=()=>{if(confirm('Close this session and disconnect updated game clients? Player results remain available.'))control({status:'ENDED',remaining:0,forceClosedAt:Date.now()})};
$('send').onclick=()=>{const announcement=$('announcement').value.trim();if(announcement)control({announcement,announcementAt:Date.now()})};
setInterval(()=>{const ms=session.status==='LIVE'?Math.max(0,session.deadline-Date.now()):session.remaining||0;$('session').textContent=(session.status||'READY')+' • '+Math.ceil(ms/60000)+' min remaining'},500);
$('deleteRoom').onclick=async()=>{const target=room;if(!target||auth.currentUser?.uid!==teacher)return message('Connect a room first');if(session.status!=='ENDED')return message('End the game and export CSV before deleting.');if(prompt('Export your results first. All player data will be permanently deleted. Type '+target+' to confirm.')!==target)return;const b=$('deleteRoom');b.disabled=true;try{await remove(collection(db,'artifacts','english-fisher-quest','public','data','room_'+target));await setDoc(doc(db,'rooms',target),{status:'ENDED',deleted:true,deadline:0,remaining:0});message('Player data deleted: '+target)}catch(e){message('Delete failed: '+e.code)}finally{b.disabled=false}};
$('export').onclick=()=>{const esc=v=>{let t=String(v??'');if(/^[=+@\-\t\r]/.test(t))t="'"+t;return '"'+t.replaceAll('"','""')+'"'};const csv=[['Name','Coins','Energy','Ship','Rod','Correct','Wrong','Answered','Academic Score','Biography C/T','Figurative C/T','Narrative C/T','Mission'],...players.map(p=>[p.name,p.coins,p.energy,p.boatLevel,p.rodLevel,p.correct??0,p.wrong??0,...academic(p)])].map(r=>r.map(esc).join(',')).join('\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const a=document.createElement('a');a.href=u;a.download=room+'-results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
</script></html>
